name: zinapspay
description: "ZinapsPay - Comprehensive fintech platform for payment processing and billing solutions"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^14.0.0

  # HTTP & API
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI Utilities
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Date & Time
  intl: ^0.20.2

  # Utilities
  equatable: ^2.0.5
  logger: ^2.0.2
  url_launcher: ^6.2.4
  syncfusion_flutter_datagrid: ^32.1.20
  syncfusion_flutter_core: ^32.1.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
